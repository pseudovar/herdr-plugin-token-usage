name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a release PR open with the next version and changelog; merging it tags vX.Y.Z
      # and publishes a GitHub Release. With the default token, CI doesn't run on the release
      # PR itself; add a fine-grained token as RELEASE_PLEASE_TOKEN to change that.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
